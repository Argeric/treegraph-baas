user nginx;
worker_processes  1;
events {
    worker_connections  1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;


    server {
        listen 80;
        location / {
         proxy_pass http://balance;
        }
    }

    upstream balance{
      server baas_backend_web_1:9797;
      # server baas_backend_web_2:9797;
      # server baas_backend_web_3:9797;
    }
    include /etc/nginx/conf.d/*.conf;
}