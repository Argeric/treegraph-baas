server:
  port: ${server.listener.port}
  tomcat:
    uri-encoding: utf-8
    max-threads: 200
    accept-count: 50
  context-path: /treegraph-baas
  
spring:
  application:
    name: treegraph-baas
  http:
    encoding:
      charset: utf-8
      force: true
      enabled: true
    multipart:
      max-file-size: 50Mb
      max-request-size: 50Mb    
  datasource:
    druid:
      data-sources:
        primary: 
          driver-class-name: ${primary.jdbc.driver}    
          url: ${primary.jdbc.url}
          username: ${primary.jdbc.username}
          password: ${primary.jdbc.password}
          initial-size: ${primary.jdbc.initialSize}
          max-active: ${primary.jdbc.maxActive}      
          min-idle: ${primary.jdbc.minIdle}
          test-on-borrow: true
          max-wait: 60000
          timeBetweenEvictionRunsMillis: 60000
          minEvictableIdleTimeMillis: 300000
          validationQuery: SELECT 'x'
          poolPreparedStatements: true
          maxOpenPreparedStatements: 20
          filters: stat, slf4j
  redis:
    host: ${redis.host}
    port: ${redis.port}    
    password: ${redis.password}
    database: ${redis.database}        
  kafka:
    bootstrap-servers: ${kafka.brokers}  
    consumer:
      group-id: ${kafka.consumer.groupId}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable.auto.commit: true
      auto.commit.interval.ms: 1000
      session.timeout.ms: 15000 
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer 
  mail:
    host: smtp.exmail.qq.com
    username: footstone.crm@mljr.com
    password: Footstone_321  
  profiles: 
    active: ${profile.name}
        
security:
  basic:
    enabled: false
    
mybatis:
  configuration:
    cache-enabled: false
    map-underscore-to-camel-case: true
