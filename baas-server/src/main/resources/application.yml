server:
  port: ${server.listener.port}
  tomcat:
    uri-encoding: utf-8
    max-threads: 200
    accept-count: 50
  context-path: /treegraph-baas
  
spring:
  application:
    name: treegraph-baas
  http:
    encoding:
      charset: utf-8
      force: true
      enabled: true
    multipart:
      max-file-size: 50Mb
      max-request-size: 50Mb    
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      data-sources:
        primary: 
          driver-class-name: ${primary.jdbc.driver}    
          url: ${primary.jdbc.url}
          username: ${primary.jdbc.username}
          password: ${primary.jdbc.password}
          initial-size: ${primary.jdbc.initialSize}
          max-active: ${primary.jdbc.maxActive}      
          min-idle: ${primary.jdbc.minIdle}
    initial-size: 10
    min-idle: 10
    max-active: 200
    max-wait: 60000
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000
    test-on-borrow: true
  mail:
    host: smtp.exmail.qq.com
    username: footstone.crm@mljr.com
    password: Footstone_321

security:
  basic:
    enabled: false

rest:
  httpclient:
    connection-request-timeout: 10000
    connect-timeout: 1000
    read-timeout: 1000

logging:
  level:
    org.treegraph.baas.*: DEBUG
    
mybatis:
  configuration:
    cache-enabled: false
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  rowboundsWithCount: true
  offsetAsPageNum: true
  supportMethodsArguments: false  

data-scope:
  globalMethod:
    Permission: all
    UserInfo: all
    UserInvite: all
    UserLoginToken: all
    UserOperLog: all

management:
  endpoints:
    web:
      exposure:
        include=*:
