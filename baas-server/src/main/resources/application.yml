rest:
  httpclient:
    connection-request-timeout: 10000
    connect-timeout: 3000
    read-timeout: 3000          

crm:
  job:
    adminAddresses: ${url.crm.job} 
    executorAppName: mljr-repaytoolkit
    executorIp:
    executorPort: ${port.crm.job}
    executorLogPath: /opt/data/logs/mljr-repaytoolkit/jobhandler
    executorLogRetentionDays: 30  
    
topic:
  kafka:
    lyqcFinAccountNotify: ${topic.lyqcFinAccountNotify} 
    lyqcFinAccountCallBack: ${topic.lyqcFinAccountCallBack}

