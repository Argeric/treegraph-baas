######################## http port #######################http_provider_port
server.port=9797
port.crm.job={{crmjob_port}}

########################### db ###########################
jdbc.driver=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://{{db_crm_repaytoolkit['host']}}:{{db_crm_repaytoolkit['port']}}/{{db_crm_repaytoolkit['db']}}?useSSL=false&characterEncoding=utf8&allowMultiQueries=true
jdbc.username={{db_crm_repaytoolkit['username']}}
jdbc.password={{db_crm_repaytoolkit['password']}}
jdbc.initialSize=5
jdbc.maxActive=20
jdbc.minIdle=5

########################## redis ##########################
redis.host={{redis_conf_2['host']}}
redis.port={{redis_conf_2['port']}}
redis.password={{redis_conf_2['password']}}
redis.database=2

########################## kafka ##########################
kafka.brokers={{kafka_cluster_hlt}}
kafka.consumer.groupId=crm-repaytoolkit

########################### env ###########################
profile.name={{env}}