######################## http port #######################http_provider_port
server.port=9797
port.crm.job={{crmjob_port}}

########################### db ###########################
primary.jdbc.driver=com.mysql.jdbc.Driver
primary.jdbc.url=jdbc:mysql://{{db_crm_repaytoolkit['host']}}:{{db_crm_repaytoolkit['port']}}/{{db_crm_repaytoolkit['db']}}?useSSL=false&characterEncoding=utf8&allowMultiQueries=true
primary.jdbc.username={{db_crm_repaytoolkit['username']}}
primary.jdbc.password={{db_crm_repaytoolkit['password']}}
primary.jdbc.initialSize=5
primary.jdbc.maxActive=20
primary.jdbc.minIdle=5

########################## redis ##########################
redis.host={{redis_conf_2['host']}}
redis.port={{redis_conf_2['port']}}
redis.password={{redis_conf_2['password']}}
redis.database=2

########################## kafka ##########################
kafka.brokers={{kafka_cluster_hlt}}
kafka.consumer.groupId=crm-repaytoolkit

########################### env ###########################
profile.name={{env}}